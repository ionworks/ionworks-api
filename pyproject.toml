[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ionworks-api"
version = "0.6.0"
description = "Python client for interacting with the Ionworks API"
authors = []
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "pydantic>=2.12.5,<3",
    "pandas>=2.0,<3",
    "polars-lts-cpu>=1.33.1",
    "numpy>=1.26,<2",
    "supabase>=2.28.0",
    "iwutil>=0.4.0",
    "pybamm>=25.12.2",
    "pyarrow>=14.0.0",
    "scipy>=1.12",
]

[project.urls]
Homepage = "https://ionworks.com"
Documentation = "https://packages.docs.ionworks.com/ionworks-api/"
Repository = "https://github.com/ionworks/ionworks-api"

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "types-requests>=2.31.0",
]
docs = ["sphinx>=7.0.0", "furo", "myst-nb>=1.0.0"]

[tool.uv.sources]
iwutil = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["ionworks"]

[tool.hatch.build.targets.sdist]
packages = ["ionworks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
