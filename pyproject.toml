[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ionworks-api"
version = "0.15.1"
description = "Python client for interacting with the Ionworks API"
authors = []
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32.5",
    "pydantic>=2.12.5,<3",
    "pandas>=2.0,<3",
    "polars>=1.33.1",
    "numpy>=1.26",
    "ionworks-schema>=0.4.0",
    "pybamm>=26.6.2.0",
    "pyarrow>=14.0.0",
    "scipy>=1.13",
]

[project.urls]
Homepage = "https://ionworks.com"
Documentation = "https://packages.docs.ionworks.com/ionworks-api/"
Repository = "https://github.com/ionworks/ionworks-api"

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "types-requests>=2.31.0",
]
docs = ["sphinx>=7.0.0", "furo", "myst-nb>=1.0.0"]

[tool.uv.sources]
ionworks-schema = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["ionworks"]

[tool.hatch.build.targets.sdist]
packages = ["ionworks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
